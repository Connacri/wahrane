name: wahrane
description: A new Wahane project.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0-173.0.dev <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^4.17.5
  firebase_messaging: ^14.7.10
  firebase_database: ^10.5.7
  firebase_core: ^2.32.0
  firebase_auth: ^4.16.0
  firebase_storage: ^11.6.5
  google_sign_in: ^5.4.4
  cached_network_image: 3.4.1
  flutter_slidable: ^2.0.0
  lottie: 3.6.1
  provider: ^6.0.5
  fluttertoast: 10.0.2
  font_awesome_flutter: 11.0.0
  email_validator: ^2.1.17
  flutter_native_splash: 2.4.8
  shared_preferences: 2.5.5
  avatar_glow: ^2.0.2
  url_launcher: 6.3.3
  carousel_slider: 5.1.2
  image_picker: 1.2.3
  intl_phone_field: ^3.1.0
  pretty_qr_code: ^2.0.3
  ticket_widget: ^0.0.1
  readmore: ^2.2.0
  flutterflow_paginate_firestore: ^1.0.3+1
  dart_date: ^1.1.1
  flutter_staggered_grid_view: ^0.6.2
  http: 1.6.0
  calendar_timeline: ^1.0.5
  syncfusion_flutter_calendar: ^20.3.47
  favorite_button: ^0.0.4
  like_button: ^2.0.5
  timeago: ^3.3.0
  video_player: 2.14.1
  geolocator: ^9.0.2
#  geocode: ^1.0.2
#  map_launcher: ^2.4.0
  open_location_picker: 1.1.0
  permission_handler: 13.0.2
  entry: ^0.0.7
  sliding_up_panel2: ^3.2.2
  marquee: ^2.2.3
  geocoding: 2.2.2
  screenshot: ^1.2.3
  shimmer: ^2.0.0
  rename: ^2.1.1
  flutter_rating_bar: ^4.0.1
  horizontal_calendar:



  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: 0.14.4
  flutter_lints: ^2.0.1

dependency_overrides:
  flutter_plugin_android_lifecycle: ^2.0.35
  google_sign_in_android: ^6.2.1
  geolocator_android: ^5.0.3
  path_provider: ^2.1.5
  path_provider_android: ^2.2.23
  path_provider_platform_interface: ^2.1.3
  sqflite: ^2.4.4
  sqflite_android: ^2.4.4
  sqflite_common: ^2.5.13
  intl: ^0.20.2
  calendar_timeline: 1.1.1
  horizontal_calendar: ^1.1.2

flutter_icons:
  android: true
  ios: true
#  image_path: "assets/images/dolphin-emoji.png"
  image_path: "assets/images/ic_launcher/1024.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/dolphin-emoji.png"
#    image_path: "assets/images/ic_launcher/1024.png"
    adaptive_icon_foreground: "assets/images/ic_launcher/1024.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/images/ic_launcher/1024.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/images/ic_launcher/1024.png"

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/ic_launcher/1024.png

flutter:

  uses-material-design: true
  generate: true



  fonts:
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Bold.ttf
        - asset: assets/fonts/Oswald-ExtraLight.ttf
        - asset: assets/fonts/Oswald-SemiBold.ttf
        - asset: assets/fonts/Oswald-Regular.ttf
        - asset: assets/fonts/Oswald-Light.ttf
        - asset: assets/fonts/Oswald-Medium.ttf
        - asset: assets/fonts/ArbFONTS-khalaad-al-arabeh.ttf
        - asset: assets/fonts/NizarBBCKurdish-Bold.ttf

  assets:
    - assets/
    - assets/lotties/
    - assets/images/ic_launcher/1024.png
    - assets/firebase_logo.png
    - assets/google_logo.png


